[package]
name = "currspice_mods"
version = "0.1.0"
edition = "2024"

[lib]
name = "currspice_mods"
path = "src/lib.rs"

[[bin]]
name = "currspice_mods"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12.15", features = ["blocking"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
serde_yaml = "0.9.34"
sha2 = "0.10.9"
sysinfo = "0.35.1"
zip = "2"

tempfile = "3"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
proptest = "1"

[build-dependencies]
winres = "0.1"
